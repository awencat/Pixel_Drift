<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>像素飞行 · Pixel Glider</title>
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
<div id="game-root"></div>

<!--
  普通 <script>（非 ES Module）。包含 PNG 资源，推荐通过本地 HTTP 服务运行：
  python -m http.server 8080 --bind 127.0.0.1

  各文件的顶层 const / class 处于同一个全局词法作用域，天然互相可见，
  所以这里必须按依赖顺序加载 —— 下文每个文件都注明它依赖谁。

  ⚠ 新增模块时请插到正确位置：被依赖者必须排在依赖者前面，
    且 src/main.js 必须始终是最后一个（它在加载时就会 new Phaser.Game()）。
-->

<!-- Phaser 3（来自 CDN，离线运行时需下载到本地） -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

<!-- [A] 全局常量 & TUNING —— 无依赖 -->
<script src="src/config/constants.js"></script>
<!-- [B] 角色数据 —— 无依赖 -->
<script src="src/config/characters.js"></script>
<!-- [C] 生物群系 —— 依赖 constants（构造 BIOMES 时读 TUNING） -->
<script src="src/config/biomes.js"></script>

<!-- [D] 工具函数 —— 无依赖 -->
<script src="src/utils/helpers.js"></script>
<!-- [E] 占位素材工厂 —— 依赖 helpers、characters -->
<script src="src/gfx/TextureFactory.js"></script>
<script src="src/gfx/ArtAssets.js"></script>

<!-- [F] 实体系统 —— 必须按 基类 → 子类 的顺序 -->
<script src="src/entities/Entity.js"></script>
<script src="src/entities/WallEntity.js"></script>
<script src="src/entities/FloaterEntity.js"></script>
<script src="src/entities/VineEntity.js"></script>
<script src="src/entities/EnemyEntity.js"></script>
<script src="src/entities/ProjectileEntity.js"></script>
<script src="src/entities/BeeEntity.js"></script>
<script src="src/entities/BatEntity.js"></script>
<script src="src/entities/PhantomEntity.js"></script>
<script src="src/entities/GlowEntity.js"></script>
<script src="src/entities/FireballEntity.js"></script>
<script src="src/entities/GhastEntity.js"></script>
<script src="src/entities/EmeraldEntity.js"></script>
<script src="src/entities/LifeCrystalEntity.js"></script>

<!-- [G][H] 系统层 —— 依赖 constants 与各实体类 -->
<script src="src/systems/BackgroundManager.js"></script>
<script src="src/systems/SpawnManager.js"></script>

<!-- [I][J][K] 场景 —— 依赖 constants / characters / biomes / 系统层 -->
<script src="src/scenes/BootScene.js"></script>
<script src="src/scenes/MenuScene.js"></script>
<script src="src/scenes/CharacterSelectScene.js"></script>
<script src="src/scenes/GameScene.js"></script>
<script src="src/scenes/GameOverScene.js"></script>

<!-- [L] 入口 —— 必须最后加载 -->
<script src="src/main.js"></script>
</body>
</html>
